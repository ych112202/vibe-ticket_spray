<script>
'use strict';
/* CORE START — pure game rules, independent of the page. */
class TicketGame {
  constructor(sections, now, random = Math.random) {
    this.sections = sections; this.now = now; this.random = random;
    this.seats = []; this.sectionSeats = new Map();
    for (const section of sections) {
      const indices = [];
      for (const [row, numbers] of section.rows) for (const number of numbers) {
        const index = this.seats.length;
        this.seats.push({index, sectionId:section.id, section:section.name, row, number, price:section.price});
        indices.push(index);
      }
      this.sectionSeats.set(section.id, indices);
    }
    this.phase = 'home'; this.revision = 0; this.sequence = 0;
    this.saleOffsets = [...Array.from({length:14},(_,i)=>(i+1)*4000), ...Array.from({length:30},(_,i)=>60000+i*2000)];
  }
  start(t = this.now()) {
    if (this.phase !== 'home') return false;
    this.runId = `CQ-${Date.now().toString(36)}-${++this.sequence}-${Math.floor(this.random()*1e8).toString(36)}`;
    this.startedAt = t; this.countdownEnd = t+10000;
    this.rank = 1+Math.floor(this.random()*5000); this.queueDuration = 5000+Math.floor(this.random()*5001);
    this.queueEnd = this.countdownEnd+this.queueDuration;
    this.challengeAt = null; this.deadline = null; this.target = 1;
    this.selected = new Set(); this.available = new Set(); this.status = new Uint8Array(this.seats.length);
    this.order = null; this.captcha = ''; this.result = null; this.saleCursor = 0;
    this.phase = 'countdown'; this.revision++; return true;
  }
  enterSelection() {
    const count = this.seats.length;
    this.initialRatio = .35 + .45*(this.rank-1)/4999;
    const soldCount = Math.min(Math.floor(count*this.initialRatio), count-2);
    const shuffled = Array.from({length:count},(_,i)=>i);
    for(let i=count-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
    for(let i=0;i<count;i++){const index=shuffled[i];if(i<soldCount)this.status[index]=1;else this.available.add(index);}
    this.challengeAt = this.queueEnd; this.deadline = this.challengeAt+120000;
    this.phase = 'selecting'; this.revision++;
  }
  advance(t = this.now()) {
    if(this.phase==='countdown' && t>=this.countdownEnd)this.phase='queue';
    if(this.phase==='queue' && t>=this.queueEnd)this.enterSelection();
    if(!this.active())return;
    while(this.saleCursor<this.saleOffsets.length && this.challengeAt+this.saleOffsets[this.saleCursor]<=t && this.active()) {
      const eventAt=this.challengeAt+this.saleOffsets[this.saleCursor++];
      if(this.available.size){
        const pool=Array.from(this.available), amount=Math.min(pool.length,Math.max(1,Math.ceil(pool.length*.01)));
        for(let i=0;i<amount;i++){const j=i+Math.floor(this.random()*(pool.length-i));[pool[i],pool[j]]=[pool[j],pool[i]];const index=pool[i];this.available.delete(index);this.status[index]=1;}
        this.revision++; this.checkSoldOut(eventAt);
      }
    }
    if(this.active() && t>=this.deadline)this.finish(false,'timeout',this.deadline);
  }
  active(){return this.phase==='selecting'||this.phase==='checkout';}
  checkSoldOut(t){if(this.active()&&!this.selected.size&&!this.available.size)this.finish(false,'soldout',t);}
  toggle(index,t=this.now()) {
    this.advance(t); if(this.phase!=='selecting')return {error:'本階段無法變更座位。'};
    if(!Number.isInteger(index)||!this.seats[index])return {error:'找不到這個座位。'};
    if(this.status[index]===1)return {error:'這個座位已售出，請選擇其他座位。'};
    if(this.selected.has(index)){this.selected.delete(index);this.status[index]=0;this.available.add(index);}
    else {if(this.selected.size>=this.target)return {error:`已選滿 ${this.target} 張，請先取消一席再更換。`};this.selected.add(index);this.available.delete(index);this.status[index]=2;}
    this.revision++;this.checkSoldOut(t);return {ok:true};
  }
  quantity(value,keep=null,t=this.now()) {
    this.advance(t);if(this.phase!=='selecting'||![1,2].includes(value))return {error:'目前無法變更購票張數。'};
    if(value===1&&this.selected.size===2){
      if(keep===null)return {chooseKeep:true};
      if(!this.selected.has(keep))return {error:'請指定要保留的座位。'};
      for(const i of [...this.selected])if(i!==keep){this.selected.delete(i);this.status[i]=0;this.available.add(i);}
    }
    this.target=value;this.revision++;return {ok:true};
  }
  toCheckout(t=this.now()) {
    this.advance(t);if(this.phase!=='selecting')return {error:'選位已結束。'};
    if(this.selected.size!==this.target)return {error:`請選滿 ${this.target} 張票再前往結帳。`};
    this.order=[...this.selected].map(i=>({...this.seats[i]}));this.phase='checkout';this.makeCaptcha();return {ok:true};
  }
  makeCaptcha() {
    const chars='23456789ABCDEFGHJKMNPQRSTUVWXYZ';
    let next=Array.from({length:4},()=>chars[Math.floor(this.random()*chars.length)]).join('');
    if(next===this.captcha)next=chars[(chars.indexOf(next[0])+1)%chars.length]+next.slice(1);
    this.captcha=next;return next;
  }
  refreshCaptcha(t=this.now()){this.advance(t);if(this.phase!=='checkout')return false;this.makeCaptcha();return true;}
  returnToSeats(t=this.now()) {
    this.advance(t);if(this.phase!=='checkout')return {error:'本次結帳已結束。'};
    for(const i of this.selected){this.status[i]=0;this.available.add(i);}
    this.selected.clear();this.order=null;this.captcha='';this.phase='selecting';this.revision++;this.checkSoldOut(t);return {ok:true};
  }
  submit(value,t=this.now()) {
    this.advance(t);if(this.phase!=='checkout')return {error:'本次結帳已結束。'};
    if(String(value).trim().toUpperCase()!==this.captcha)return {error:'驗證碼不正確，請再試一次。'};
    if(!this.order||this.order.length!==this.target||this.selected.size!==this.target||new Set(this.order.map(s=>s.index)).size!==this.target || !this.order.every(s=>this.selected.has(s.index)&&this.status[s.index]===2&&s.price===this.seats[s.index].price))return {error:'訂單狀態不一致，請返回選位後重試。'};
    this.finish(true,'',t);return {ok:true};
  }
  finish(success,reason,t) {
    if(!this.active()||this.result)return;
    this.result={id:this.runId,success,reason,target:this.target,quantity:success?this.order.length:0,
      totalTime:Math.max(0,t-this.startedAt),challengeTime:Math.max(0,t-this.challengeAt),completedAt:new Date().toISOString(),
      seats:success?this.order.map(s=>({...s})):[]};
    this.phase=success?'success':'failure';this.revision++;
  }
  home(){if(this.active()||this.phase==='countdown'||this.phase==='queue')return false;this.phase='home';this.revision++;return true;}
  total(){return [...this.selected].reduce((sum,i)=>sum+this.seats[i].price,0);}
  remaining(t=this.now()){return this.deadline===null?120000:Math.max(0,this.deadline-t);}
}
/* CORE END */

const sections=JSON.parse(document.getElementById('seat-data').textContent);
const sectionById=new Map(sections.map(s=>[s.id,s]));
const baseWall=Date.now(),baseMono=performance.now();let lastClock=baseMono;
function clock(){return lastClock=Math.max(lastClock,performance.now(),baseMono+Date.now()-baseWall);}
const game=new TicketGame(sections,clock);
const app=document.getElementById('app'),steps=document.getElementById('steps'),modal=document.getElementById('modal');
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=value=>`NT$${value.toLocaleString('en-US')}`;
const seconds=value=>`${(value/1000).toFixed(1)} 秒`;
const seatLabel=s=>`${s.section}・第 ${s.row} 排 ${s.number} 號`;
const reasonText={timeout:'選位與結帳時間已用完',soldout:'座位已全數售出'};
const colors={6280:'#efd58b',5480:'#7bbaf2',4280:'#71d7c0',3680:'#eba7c4'};
let storageWarning=false,records=[],bests={},interrupted=false;
function validRecord(r){return r&&typeof r.id==='string'&&r.id.length<160&&typeof r.success==='boolean'&&[1,2].includes(r.target)&&Number.isFinite(r.totalTime)&&r.totalTime>=0&&Number.isFinite(r.challengeTime)&&r.challengeTime>=0&&r.challengeTime<=120001&&typeof r.completedAt==='string'&&Number.isFinite(Date.parse(r.completedAt))&&(!r.success||[1,2].includes(r.quantity));}
try{const raw=localStorage.getItem('concertQuest.records.v1');if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(validRecord))throw Error('records');records=parsed.slice(0,10);}const bestRaw=localStorage.getItem('concertQuest.bests.v1');if(bestRaw){const parsed=JSON.parse(bestRaw);if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw Error('bests');for(const q of [1,2])if(parsed[q]){if(!validRecord(parsed[q])||!parsed[q].success||parsed[q].quantity!==q)throw Error('best');bests[q]=parsed[q];}}}catch{storageWarning=true;}
try{interrupted=sessionStorage.getItem('concertQuest.active')==='1';sessionStorage.removeItem('concertQuest.active');}catch{}
function activeMarker(active){try{if(active)sessionStorage.setItem('concertQuest.active','1');else sessionStorage.removeItem('concertQuest.active');}catch{}}
const savedRuns=new Set(records.map(r=>r.id));let newBest=false;
function saveResult(){const r=game.result;if(!r||savedRuns.has(r.id))return;savedRuns.add(r.id);const record={...r};delete record.seats;newBest=false;
  records=[record,...records.filter(x=>x.id!==r.id)].slice(0,10);
  if(r.success&&(!bests[r.quantity]||r.challengeTime<bests[r.quantity].challengeTime)){bests[r.quantity]=record;newBest=true;}
  try{localStorage.setItem('concertQuest.records.v1',JSON.stringify(records));localStorage.setItem('concertQuest.bests.v1',JSON.stringify(bests));}catch{storageWarning=true;}
  activeMarker(false);
}

let focusBeforeDialog=null;

function showModal(title,content,actions){focusBeforeDialog=document.activeElement;document.getElementById('modal-title').textContent=title;document.getElementById('modal-content').innerHTML=content;const host=document.getElementById('modal-actions');host.replaceChildren();for(const a of actions){const b=document.createElement('button');b.className=`btn ${a.primary?'primary':''}`;b.textContent=a.text;b.addEventListener('click',a.action);host.append(b);}if(!modal.open)modal.showModal();}
function history(){const rows=records.map(r=>`<tr><td class="${r.success?'ok':'no'}">${r.success?'成功':'失敗'}<small>${esc(new Date(r.completedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}))}</small></td><td>${r.success?r.quantity:r.target} 張<small>${r.success?'完成購票':esc(reasonText[r.reason]||'挑戰未完成')}</small></td><td>${seconds(r.challengeTime)}<small>總流程 ${seconds(r.totalTime)}</small></td></tr>`).join('');
  showModal('你的搶票紀錄',`<p>只保存在此瀏覽器，顯示最近 10 局。最佳紀錄依最終購票張數分組，比較選位結帳時間。</p>${records.length?`<table class="record-table"><thead><tr><th>結果／日期</th><th>張數</th><th>選位結帳時間</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty-selection">還沒有挑戰紀錄。<br>從第一次搶票開始吧。</div>'}${storageWarning?'<p class="notice warn">目前無法可靠保存紀錄，這次仍可正常遊玩。</p>':''}`,[{text:'關閉',action:closeModal}]);
}

  lastRevision=-1;
}
function paintCaptcha(){const output=document.getElementById('captcha-code');output.innerHTML=[...game.captcha].map(c=>`<span>${c}</span>`).join('');output.setAttribute('aria-label',`驗證碼 ${[...game.captcha].join(' ')}`);}

function bindSelection(){document.querySelectorAll('[data-quantity]').forEach(b=>b.onclick=()=>{const res=game.quantity(Number(b.dataset.quantity));sync();if(res.chooseKeep)chooseKeep();else if(res.error)toast(res.error);});document.querySelectorAll('[data-checkout]').forEach(b=>b.onclick=()=>{const r=game.toCheckout();sync();if(r.error)toast(r.error);else window.scrollTo({top:0,behavior:'instant'});});document.getElementById('zone-select').onchange=e=>{game.advance();sync();if(game.phase==='selecting')showZone(e.target.value||null);};document.getElementById('back-overview').onclick=()=>showZone(null);document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoomMap(b.dataset.zoom==='in'?1.5:b.dataset.zoom==='out'?1/1.5:0));}

function updateSelection(){const count=game.selected.size;
  document.querySelectorAll('[data-quantity]').forEach(b=>{const active=Number(b.dataset.quantity)===game.target;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});

  document.querySelectorAll('[data-total]').forEach(n=>n.textContent=money(game.total()));document.querySelectorAll('[data-checkout]').forEach(b=>{b.disabled=count!==game.target;});

}
function polar(r,a){const rad=a*Math.PI/180;return [500+r*Math.cos(rad),360+r*Math.sin(rad)];}
function wedge(a,span,ri,ro){const p=[];for(let i=0;i<=16;i++)p.push(polar(ro,a-span/2+span*i/16));for(let i=0;i<=16;i++)p.push(polar(ri,a+span/2-span*i/16));return `M${p.map(v=>v.map(n=>n.toFixed(2)).join(',')).join('L')}Z`;}

  const top=[['黃1B單',170,178],['黃2B雙',170,255],['黃2B單',170,332],['橙1B雙',710,178],['橙2B單',710,255],['橙2B雙',710,332]];
  for(const [name,x,y] of top)content+=make(name,`<rect x="${x}" y="${y}" width="120" height="61" rx="4"/>`,x+60,y+25);
  const inner=['黃4B雙','黃4B單','藍5B雙','藍5B單','藍4B雙','藍4B單','藍3B雙','藍3B單','藍2B雙','藍2B單','藍1B雙','藍1B單','橙4B雙','橙4B單'];
  inner.forEach((name,i)=>{const a=165-i*150/13,[x,y]=polar(283,a);content+=make(name,`<path d="${wedge(a,10.2,239,328)}"/>`,x,y-3);});
  const outer=['黃4A-1','藍5A-3','藍5A-2','藍5A-1','藍4A-2','藍4A-1','藍3A-1','藍2A-2','藍2A-1','藍1A-2','藍1A-1','橙4A-1'];
  outer.forEach((name,i)=>{const a=166-i*152/11,[x,y]=polar(391,a);content+=make(name,`<path d="${wedge(a,11.5,355,426)}"/>`,x,y-2);});
  content+=make('模擬無障礙席','<rect x="849" y="255" width="120" height="61" rx="6"/>',909,280);
  content+='<rect x="468" y="482" width="64" height="36" rx="5" fill="#24283c"/><text x="500" y="505" font-size="12" fill="#b4bad1" text-anchor="middle">FOH</text><text x="500" y="559" fill="#bdadf1" font-size="12" text-anchor="middle">CONCERT QUEST</text><text x="500" y="579" fill="#a4abc7" font-size="10" text-anchor="middle">點選分區，查看座位</text><text x="500" y="842" fill="#8794b3" font-size="11" text-anchor="middle">示意尺度與方向 · 非官方售票配置</text>';
  return `<svg viewBox="0 0 1000 860" role="group" aria-label="場館分區總覽，38 個入口">${content}</svg>`;
}
function updateZoneDescription(){const s=sectionById.get(currentZone);if(!s)return;const st=zoneStats(s.id);document.getElementById('map-description').textContent=`${money(s.price)}／席 · 可選 ${st.available} · 已選 ${st.selected} · 含模擬配置`;}
function showZone(id){if(game.phase!=='selecting')return;if(id&&!sectionById.has(id))return;currentZone=id;mapNodes.clear();mapState=null;
  document.getElementById('zone-select').value=id||'';document.getElementById('back-overview').classList.toggle('hidden',!id);document.getElementById('zoom-tools').classList.toggle('hidden',!id);const frame=document.getElementById('map-frame');frame.classList.toggle('overview',!id);
  if(!id){document.getElementById('map-heading').textContent='場館分區總覽';document.getElementById('map-description').textContent='選擇分區查看座位，或用上方選單快速進入。';frame.innerHTML=overviewMarkup();frame.querySelectorAll('[data-zone]').forEach(n=>{n.onclick=()=>showZone(n.dataset.zone);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showZone(n.dataset.zone);}};});document.getElementById('seat-hint').textContent='已選座位會跨區保留；完售分區仍可查看。';}
  else {document.getElementById('map-heading').textContent=sectionById.get(id).name;drawZone(frame,sectionById.get(id));}
  updateSelection();lastRevision=game.revision;
}
function drawZone(frame,section){const vip=section.name.startsWith('VIP'),sideB=/^[黃橙].*B/.test(section.name),blueB=/^藍.*B/.test(section.name);
  const rowIds=section.rows.map(r=>r[0]),seatNumbers=Array.from({length:(section.hi-section.lo)/section.step+1},(_,i)=>section.lo+i*section.step),cell=36,margin=58;
  const columns=sideB?rowIds.length:seatNumbers.length,rows=sideB?seatNumbers.length:rowIds.length;
  const width=margin*2+columns*cell,height=margin*2+rows*cell+28,positions=new Map();
  let text='',items='';let firstFocus=null;
  const reverseRows=sideB&&section.name.startsWith('橙');
  const reverseSeats=sideB&&(section.name==='黃2B雙'||section.name==='黃4B雙'||section.name==='橙2B單'||section.name==='橙4B單');
  for(const r of rowIds){const ri=rowIds.indexOf(r),col=reverseRows?rowIds.length-1-ri:ri;const labelX=sideB?margin+(col+.5)*cell:margin-24;const labelY=sideB?margin-18:margin+((blueB?rowIds.length-1-ri:ri)+.5)*cell;text+=`<text x="${labelX}" y="${labelY}" class="row-label">${r}</text>`;}
  const indexByKey=new Map(game.sectionSeats.get(section.id).map(i=>{const s=game.seats[i];return [`${s.row}:${s.number}`,i];}));
  for(const [row,numbers] of section.rows)for(const number of numbers){const ri=rowIds.indexOf(row),ni=seatNumbers.indexOf(number);let col,rr;
    if(sideB){col=reverseRows?rowIds.length-1-ri:ri;rr=reverseSeats?seatNumbers.length-1-ni:ni;}
    else {col=blueB&&section.step===2&&section.lo%2===0?seatNumbers.length-1-ni:ni;rr=blueB?rowIds.length-1-ri:ri;}
    const x=margin+col*cell,y=margin+rr*cell,index=indexByKey.get(`${row}:${number}`);positions.set(index,{x:x+cell/2,y:y+cell/2});
    if(firstFocus===null&&game.status[index]!==1)firstFocus=index;
    items+=`<g class="seat" role="button" tabindex="-1" data-seat-index="${index}"><title>${esc(seatLabel(game.seats[index]))}</title><rect x="${x+3}" y="${y+3}" width="30" height="30" rx="5"/><path class="sold-mark hidden" d="M${x+5} ${y+5}l26 26"/><text x="${x+18}" y="${y+18}">${number}</text></g>`;
  }
  const orientation=sideB?`排數由${reverseRows?'右向左':'左向右'}增加；座號由上向下${reverseSeats?'遞減':'遞增'}`:vip?'排數由上向下增加；座號由左向右增加':blueB?`排數由下向上增加；座號由左向右${section.lo%2===0?'遞減':'遞增'}`:'展開模擬視角：排數向下、座號向右增加';
  text+=`<text x="${margin}" y="24" class="axis-label">${sideB?'上方綠字為排號':'左側綠字為排號'} · 空白為缺格</text><text x="${width/2}" y="${height-15}" class="axis-label" text-anchor="middle">${esc(orientation)}</text>`;
  frame.innerHTML=`<svg id="seat-svg" viewBox="0 0 ${width} ${height}" role="group" aria-label="${esc(section.name)}完整座位圖">${text}${items}</svg>`;
  const svg=document.getElementById('seat-svg');mapState={svg,width,height,zoom:1,x:0,y:0,positions};
  frame.querySelectorAll('[data-seat-index]').forEach(node=>{const index=Number(node.dataset.seatIndex);mapNodes.set(index,node);node.addEventListener('focus',()=>hintSeat(index));node.addEventListener('pointerover',()=>hintSeat(index));node.addEventListener('keydown',e=>seatKey(e,index));node.addEventListener('click',e=>{if(e.detail===0)activateSeat(index);});});
  const focused=mapNodes.get(firstFocus??positions.keys().next().value);if(focused)focused.setAttribute('tabindex','0');
  let pointer=null;
  svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;const target=e.target.closest('[data-seat-index]');pointer={id:e.pointerId,x:e.clientX,y:e.clientY,bx:mapState.x,by:mapState.y,moved:false,index:target?Number(target.dataset.seatIndex):null,scale:svg.getScreenCTM().a};svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.hypot(dx,dy)>6)pointer.moved=true;if(pointer.moved&&mapState.zoom>1){mapState.x=pointer.bx-dx/pointer.scale;mapState.y=pointer.by-dy/pointer.scale;applyView();}});
  svg.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=pointer;pointer=null;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);if(!p.moved&&p.index!==null){const scale=svg.getScreenCTM().a;if(scale*cell<21){const pos=positions.get(p.index);zoomMap(1.65,pos);toast('已放大座位圖，請再點選想要的座位。');}else activateSeat(p.index);}});
  svg.addEventListener('pointercancel',()=>pointer=null);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomMap(e.deltaY<0?1.2:1/1.2);},{passive:false});
  document.getElementById('seat-hint').textContent='點選座位；拖曳移動、＋／− 縮放。鍵盤可用方向鍵移動、Enter 選取。';
}
function hintSeat(index){if(!currentZone||!document.getElementById('seat-hint'))return;const s=game.seats[index];document.getElementById('seat-hint').textContent=`${seatLabel(s)} · ${money(s.price)} · ${['可選','已售出','目前選取'][game.status[index]]}`;}
function activateSeat(index){const res=game.toggle(index);sync();if(res.error)toast(res.error);else if(game.phase==='selecting'){hintSeat(index);const node=mapNodes.get(index);if(node){mapNodes.forEach(n=>n.setAttribute('tabindex','-1'));node.setAttribute('tabindex','0');node.focus({preventScroll:true});}}}
function seatKey(e,index){if(e.key==='Enter'||e.key===' '){e.preventDefault();activateSeat(index);return;}const dirs={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(!dirs[e.key]||!mapState)return;e.preventDefault();const p=mapState.positions.get(index),[dx,dy]=dirs[e.key];let best=null,score=Infinity;for(const [i,q] of mapState.positions){const along=(q.x-p.x)*dx+(q.y-p.y)*dy;if(along<1)continue;const across=Math.abs((q.x-p.x)*dy-(q.y-p.y)*dx);const cost=along+across*4;if(cost<score){score=cost;best=i;}}if(best!==null){mapNodes.forEach(n=>n.setAttribute('tabindex','-1'));mapNodes.get(best).setAttribute('tabindex','0');mapNodes.get(best).focus({preventScroll:true});if(mapState.zoom>1){const q=mapState.positions.get(best);mapState.x=q.x-mapState.width/mapState.zoom/2;mapState.y=q.y-mapState.height/mapState.zoom/2;applyView();}}}
function applyView(){if(!mapState)return;const m=mapState,w=m.width/m.zoom,h=m.height/m.zoom;m.x=Math.min(Math.max(0,m.x),m.width-w);m.y=Math.min(Math.max(0,m.y),m.height-h);m.svg.setAttribute('viewBox',`${m.x} ${m.y} ${w} ${h}`);}
function zoomMap(factor,center=null){if(!mapState)return;const m=mapState,old=m.zoom;const cx=center?.x??(m.x+m.width/old/2),cy=center?.y??(m.y+m.height/old/2);m.zoom=factor===0?1:Math.max(1,Math.min(5,m.zoom*factor));m.x=cx-m.width/m.zoom/2;m.y=cy-m.height/m.zoom/2;applyView();}
function sync(){if(game.phase!==renderedPhase)render();const t=clock();
  if(game.phase==='countdown'){const n=Math.max(0,Math.ceil((game.countdownEnd-t)/1000));document.getElementById('countdown-value').textContent=String(n).padStart(2,'0');}
  if(game.phase==='queue'){const progress=Math.min(1,Math.max(0,(t-game.countdownEnd)/game.queueDuration));document.getElementById('queue-number').textContent=Math.max(0,Math.ceil((game.rank-1)*(1-progress))).toLocaleString();const p=document.getElementById('queue-progress');p.setAttribute('aria-valuenow',String(Math.round(progress*100)));p.querySelector('i').style.width=`${progress*100}%`;}
  if(game.active()){const left=Math.ceil(game.remaining(t)/1000),label=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;document.getElementById('remaining-time').textContent=label;document.getElementById('challenge-clock').classList.toggle('urgent',left<=30);for(const mark of [60,30,10])if(lastMilestone>mark&&left<=mark)announce(`剩餘 ${mark} 秒，選位與結帳倒數持續。`);lastMilestone=left;}
  if(game.phase==='selecting'&&game.revision!==lastRevision){updateSelection();lastRevision=game.revision;}
}
function tick(){game.advance();sync();}
document.addEventListener('visibilitychange',tick);window.addEventListener('pageshow',tick);
setInterval(tick,120);sync();
</script>
